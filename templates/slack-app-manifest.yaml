# AdDroid OSS — Slack App Manifest (Socket Mode only).
#
# このテンプレートは AdDroid OSS the current implementation の Slack 連携 (任意) で利用する
# Slack App の "From an app manifest" 用入力です。Slack の管理画面で
# "Create New App > From an app manifest" を開き、本ファイルの内容を
# YAML として貼り付けると AdDroid と接続するための Slack App が作られます。
#
# AdDroid は localhost / outbound-only で稼働するため、以下を厳守します:
#   - Socket Mode のみ。public な request URL / 公開ドメイン / SSL 証明書 /
#     トンネリング (ngrok 等) は一切要求しません。
#   - @AdDroid メンション / DM / /adops slash command は Socket Mode 経由でルーティングされるため
#     `url:` フィールドを持ちません。
#   - Interactivity も Socket Mode 経由のため `request_url` を持ちません。
#   - bot scopes は最小集合のみ: chat:write, commands, app_mentions:read,
#     im:history, files:read, channels:read, users:read。
#   - サブコマンド: report / budget / improve / status / accounts / activate <act_id>
#     いずれも 3 秒以内 ack → pg-boss にキュー → response_url で返信の契約。
#
# Slack 連携自体は AdDroid において任意です。トークンを設定しなくても
# AdDroid OSS は通常通り稼働し、core ヘルスチェックを通過します。
display_information:
  name: AdDroid
  description: "GitOps-driven Meta ad ops console for {{workspaceDisplayName}} (Slack is optional)."
  long_description: >-
    AdDroid OSS is a self-hosted, localhost-only operator console that manages Meta ad
    operations as GitOps. This Slack app is OPTIONAL. When connected, AdDroid sends
    outbound notifications (PR opened, daily report, budget guard alerts, improvement
    PR opened, apply completed/failed, rate limit warnings, auth revoked), accepts
    natural-language requests via @AdDroid mentions and DMs, and exposes a short
    /adops slash command (report / budget / improve / status / accounts / activate).
    Slack events are acked within 3 seconds and processed asynchronously by
    AdDroid's local pg-boss worker. AdDroid uses Socket Mode exclusively and never
    requires a public webhook, request URL, or tunneling service.
  background_color: "#18181b"
features:
  bot_user:
    display_name: AdDroid
    always_online: true
  slash_commands:
    - command: /adops
      description: "AdDroid operator commands (Socket Mode; ack within 3s, processed async)."
      usage_hint: "report | budget | improve | status | accounts | activate <act_id>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - app_mentions:read
      - im:history
      - files:read
      - channels:read
      - users:read
settings:
  socket_mode_enabled: true
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
