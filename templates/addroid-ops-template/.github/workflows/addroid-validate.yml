name: addroid-validate
# This lightweight PR check gives early feedback in the ops repository.
# AdDroid validates merged PRs again server-side before Apply, so disabling
# GitHub Actions does not bypass the runtime safety boundary.
on:
  pull_request:
    paths:
      - "operations/**"
      - "workflows/cron.yaml"
      - "workflows/guards.yaml"
      - ".addroid/project.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # この ops repo は単体で git clone しただけで動作する必要があるため、ここでは
      # AdDroid CLI 本体 (`@addroid/cli`) には依存しない最小限の構造検証だけを行う。
      # 真の Zod 検証は AdDroid 側 worker が merged PR を ETag-aware ポーリングで
      # 検知したあとサーバーサイドで再実行する。PR 時のこの workflow は早期フィードバック
      # 用の placeholder で、必要なファイルの存在・YAML としての parse・最低限の
      # 主要フィールドだけを確認する。
      - name: Install YAML parser into CI-only scratch dir
        run: |
          set -euo pipefail
          mkdir -p .addroid-ci-deps
          cd .addroid-ci-deps
          printf '{"name":"addroid-ci-deps","private":true}\n' > package.json
          npm install --no-audit --no-fund --silent js-yaml@4.1.0
      - name: Structural check (project.yaml, cron.yaml, operations)
        env:
          NODE_PATH: .addroid-ci-deps/node_modules
        run: |
          node - <<'NODE'
          "use strict";
          const fs = require("node:fs");
          const path = require("node:path");
          const yaml = require("js-yaml");

          const errors = [];
          const warnings = [];
          const root = process.cwd();
          let budgetIncreaseGuard = { warnOverRatio: 2, blockOverRatio: 5 };

          function readYaml(rel) {
            const abs = path.join(root, rel);
            if (!fs.existsSync(abs)) {
              errors.push(`${rel} — required file is missing`);
              return null;
            }
            try {
              return yaml.load(fs.readFileSync(abs, "utf8"));
            } catch (e) {
              errors.push(`${rel} — YAML parse error: ${e.message}`);
              return null;
            }
          }

          // .addroid/project.yaml
          const project = readYaml(".addroid/project.yaml");
          if (project !== null) {
            if (!project || typeof project !== "object") {
              errors.push(".addroid/project.yaml — top-level must be a mapping");
            } else {
              if (typeof project.version !== "number") {
                errors.push(".addroid/project.yaml :: version — must be a number");
              }
              const ws = project.workspace;
              if (!ws || typeof ws !== "object") {
                errors.push(".addroid/project.yaml :: workspace — must be a mapping");
              } else if (typeof ws.slug !== "string" || ws.slug.length === 0) {
                errors.push(".addroid/project.yaml :: workspace.slug — must be a non-empty string");
              }
            }
          }

          // workflows/cron.yaml
          const cron = readYaml("workflows/cron.yaml");
          if (cron !== null) {
            if (!cron || typeof cron !== "object") {
              errors.push("workflows/cron.yaml — top-level must be a mapping");
            } else if (!Array.isArray(cron.schedules)) {
              errors.push("workflows/cron.yaml :: schedules — must be a list");
            } else {
              cron.schedules.forEach((s, i) => {
                const ptr = `workflows/cron.yaml :: schedules[${i}]`;
                if (!s || typeof s !== "object") {
                  errors.push(`${ptr} — must be a mapping`);
                  return;
                }
                if (typeof s.name !== "string" || s.name.length === 0) {
                  errors.push(`${ptr}.name — must be a non-empty string`);
                }
                if (typeof s.cron !== "string" || s.cron.length === 0) {
                  errors.push(`${ptr}.cron — must be a non-empty string`);
                }
                if (typeof s.enabled !== "boolean") {
                  errors.push(`${ptr}.enabled — must be a boolean`);
                }
              });
            }
          }

          // workflows/guards.yaml
          const guards = readYaml("workflows/guards.yaml");
          if (guards !== null) {
            if (!guards || typeof guards !== "object") {
              errors.push("workflows/guards.yaml — top-level must be a mapping");
            } else {
              const budget = guards.guards && guards.guards.budgetIncrease;
              if (!budget || typeof budget !== "object") {
                errors.push("workflows/guards.yaml :: guards.budgetIncrease — must be a mapping");
              } else {
                const warn = Number(budget.warnOverRatio);
                const block = Number(budget.blockOverRatio);
                if (!Number.isFinite(warn) || warn <= 0) {
                  errors.push("workflows/guards.yaml :: warnOverRatio — must be a positive number");
                }
                if (!Number.isFinite(block) || block <= 0) {
                  errors.push("workflows/guards.yaml :: blockOverRatio — must be a positive number");
                }
                if (Number.isFinite(warn) && Number.isFinite(block) && warn >= block) {
                  errors.push("workflows/guards.yaml :: warnOverRatio — must be smaller than blockOverRatio");
                }
                if (Number.isFinite(warn) && warn > 0 && Number.isFinite(block) && block > 0 && warn < block) {
                  budgetIncreaseGuard = { warnOverRatio: warn, blockOverRatio: block };
                }
              }
            }
          }

          function isObject(value) {
            return value && typeof value === "object" && !Array.isArray(value);
          }

          function readNumber(value) {
            if (typeof value === "number" && Number.isFinite(value)) return value;
            if (typeof value === "string" && value.trim().length > 0) {
              const n = Number(value);
              if (Number.isFinite(n)) return n;
            }
            return null;
          }

          function readNestedNumber(root, keys) {
            let current = root;
            for (const key of keys) {
              if (!isObject(current)) return null;
              current = current[key];
            }
            return readNumber(current);
          }

          function formatRatio(value) {
            return `${Number(value.toFixed(2))}x`;
          }

          function evaluateBudgetIncreaseGuard(opRel, action, index) {
            if (!isObject(action) || typeof action.kind !== "string") return;
            if (action.kind !== "campaign.update" && action.kind !== "adset.update") return;
            const payload = isObject(action.payload) ? action.payload : {};
            const graphPayload = isObject(payload.graphPayload) ? payload.graphPayload : {};
            const guardContext = isObject(payload.guardContext) ? payload.guardContext : {};
            const checks = [
              {
                label: `${action.kind}.dailyBudget`,
                next: readNumber(payload.dailyBudget) ?? readNumber(graphPayload.daily_budget),
                previous:
                  readNumber(guardContext.currentDailyBudget) ??
                  readNumber(payload.currentDailyBudget) ??
                  readNumber(payload.previousDailyBudget) ??
                  readNestedNumber(payload, ["budgetBefore", "dailyBudget"]) ??
                  readNestedNumber(payload, ["currentBudget", "dailyBudget"]),
              },
              {
                label: `${action.kind}.lifetimeBudget`,
                next: readNumber(payload.lifetimeBudget) ?? readNumber(graphPayload.lifetime_budget),
                previous:
                  readNumber(guardContext.currentLifetimeBudget) ??
                  readNumber(payload.currentLifetimeBudget) ??
                  readNumber(payload.previousLifetimeBudget) ??
                  readNestedNumber(payload, ["budgetBefore", "lifetimeBudget"]) ??
                  readNestedNumber(payload, ["currentBudget", "lifetimeBudget"]),
              },
            ];
            for (const check of checks) {
              if (check.next === null || check.previous === null || check.previous <= 0) continue;
              const ratio = check.next / check.previous;
              if (!Number.isFinite(ratio) || ratio < 1) continue;
              const summary = `${opRel} :: actions[${index}] ${check.label} ${check.previous} -> ${check.next} (${formatRatio(ratio)})`;
              if (ratio >= budgetIncreaseGuard.blockOverRatio) {
                errors.push(`${summary} — blocked by budget increase guard ${formatRatio(budgetIncreaseGuard.blockOverRatio)}`);
              } else if (ratio >= budgetIncreaseGuard.warnOverRatio) {
                warnings.push(`${summary} — warning by budget increase guard ${formatRatio(budgetIncreaseGuard.warnOverRatio)}`);
              }
            }
          }

          // operations/<account>/*.json
          const operationsDir = path.join(root, "operations");
          if (fs.existsSync(operationsDir)) {
            const walk = (dir, prefix) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const rel = prefix ? `${prefix}/${entry.name}` : entry.name;
                const abs = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  walk(abs, rel);
                  continue;
                }
                if (!entry.isFile() || !rel.endsWith(".json")) continue;
                const opRel = `operations/${rel}`;
                let manifest;
                try {
                  manifest = JSON.parse(fs.readFileSync(abs, "utf8"));
                } catch (e) {
                  errors.push(`${opRel} — JSON parse error: ${e.message}`);
                  continue;
                }
                if (!manifest || typeof manifest !== "object") {
                  errors.push(`${opRel} — top-level must be an object`);
                  continue;
                }
                if (manifest.version !== 1 && manifest.version !== 2) {
                  errors.push(`${opRel} :: version — must be 1 or 2`);
                }
                if (typeof manifest.accountKey !== "string" || manifest.accountKey.length === 0) {
                  errors.push(`${opRel} :: accountKey — must be a non-empty string`);
                }
                if (!Array.isArray(manifest.actions)) {
                  errors.push(`${opRel} :: actions — must be a list`);
                } else if (manifest.version === 2) {
                  manifest.actions.forEach((action, index) => {
                    evaluateBudgetIncreaseGuard(opRel, action, index);
                  });
                }
              }
            };
            walk(operationsDir, "");
          }

          if (warnings.length > 0) {
            console.log("[addroid-validate] warnings:");
            for (const w of warnings) console.log(`  - ${w}`);
            console.log("");
          }

          if (errors.length > 0) {
            console.log("[addroid-validate] structural check failed:");
            for (const e of errors) console.log(`  - ${e}`);
            console.log("");
            console.log(
              "Note: this PR-time workflow runs structural checks plus budget increase guards. " +
                "Authoritative Zod validation and apply safety checks run server-side via the AdDroid worker on merged PRs."
            );
            process.exit(1);
          }

          console.log("[addroid-validate] structural check ok");
          console.log(
            "Note: full Zod validation (mismatched account keys, " +
              "operation matrix support, approval status, and apply safety checks run server-side via the AdDroid " +
              "worker on merged PRs)."
          );
          NODE
